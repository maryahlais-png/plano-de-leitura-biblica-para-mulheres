name: Verificações de qualidade
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Executar testes
        run: npm test